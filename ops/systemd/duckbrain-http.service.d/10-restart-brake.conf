[Unit]
# OPS-015: crash-loop brake for duckbrain-http.service.
#
# StartLimitIntervalSec / StartLimitBurst are [Unit] keys. systemd ignores them
# in [Service] and warns "Unknown key name ... in section [Service], ignoring.",
# leaving the 10s/5-attempt defaults in force — a unit with Restart=always can
# trip those in ~15s and stay down. Shipped as a drop-in so a fresh deploy that
# copies ops/systemd/duckbrain-http.service.d/ gets the brake, and so operators
# can retune it without editing the base unit.
#
# StartLimitAction is left at the default: when the burst is exhausted the unit
# enters the failed state, which the health timer and the dark-port check alert
# on, rather than anything destructive.
StartLimitIntervalSec=300
StartLimitBurst=10
