# OPS-015: systemd >=230 accepts StartLimit* keys ONLY in [Unit]. Placed in
# [Service] they are silently ignored ("Unknown key StartLimitIntervalSec in
# section [Service]", logged 2026-11-17 at 11:30:17 / 15:53:58 / 16:01:31),
# which left the 10s manager default window while RestartSec=3 produced an
# unbraked 3s crash loop. With this drop-in the brake actually engages: a
# burst of 10 restarts inside 300s puts the unit in failed state (monitoring
# alerts on that alongside the dark-port check) instead of restarting forever.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10
