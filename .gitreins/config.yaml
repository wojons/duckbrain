# GitReins config — DuckBrain
# v0.3.0+ individual cap keys
# TypeScript project using vitest

guards:
  secrets: true
  lint: false # eslint config not wired yet
  tests: true
  test_mode: diff
  test_command: "npx vitest run"
  test_timeout: 300
  dead_code: false # Python-only
  skylos: false
  static_analysis: false
  lsp: false

evaluator:
  max_iterations: 250
  # 45m starved CI-005's tier-2 on 2026-09-24: tier1 PASS + INCOMPLETE "Time cap
  # (45m) exceeded" after the judge queued ~40m behind 12 concurrent fleet
  # workers. 60m rung: cap now covers queue wait, not just evaluation.
  max_time: "60m"
  # 4M starved DF-0919-01's tier-2 (the judge's clean-install reproduce needs
  # a wide exploration loop on this repo). 10M = the gitreins default.
  max_input_tokens: "10M"
  max_output_tokens: "0.05M"
  tool_call_weight: 0.1

defaults:
  model: deepseek-v4-flash

history:
  enabled: true
  storage: git
  max_verdicts: 500
