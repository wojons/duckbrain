    the record's embedding_text/content is the flag value, not the key (grep resolveRememberBody
    in src/cli/human.ts and verify precedence explicit > stdin > key)
  - A piped stdin body (non-TTY) is used as content when no flag is given (grep readStdinBody
    in src/cli/human.ts; empty pipe falls back to key)
