name: CI

on:
  push:
    branches: [main, develop, feat/native-s3]
  pull_request:
    branches: [main, develop, feat/native-s3]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-1.4.4
          restore-keys: |
            duckdb-extensions-

      - name: Pre-install DuckDB fts extension
        run: node -e "const {Database}=require('duckdb'); const db=new Database(':memory:'); db.exec('INSTALL fts'); db.exec('LOAD fts'); db.close();"

      - name: Run lint
        run: npm run lint --if-present

      - name: Run type check
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm run test:run 2>&1 | tee /tmp/vitest.out

      - name: Assert AGENTS.md test counts match live suite
        if: matrix.node-version == '22.x'   # package.json engines: node >=22 — assert once, not per matrix cell
        run: |
          STRIP='sed -r "s/\x1B\[[0-9;]*[mK]//g"'
          SUITES=$(eval "$STRIP /tmp/vitest.out" | grep -oP 'Test Files\s+.*\(\K\d+(?=\))' | tail -1)
          TESTS=$(eval "$STRIP /tmp/vitest.out" | grep -oP 'Tests\s+.*\(\K\d+(?=\))' | tail -1)
          [ -n "$SUITES" ] && [ -n "$TESTS" ] || { echo "GAP-032: vitest summary unparseable"; exit 1; }
          echo "Live: ${SUITES} suites / ${TESTS} tests"
          grep -q "(${SUITES} suites, ${TESTS} tests)" AGENTS.md \
            || { echo "GAP-012 drift: AGENTS.md Tech Stack count != live (${SUITES} suites, ${TESTS} tests)"; exit 1; }
          grep -q "# ${TESTS} tests, ${SUITES} suites" AGENTS.md \
            || { echo "GAP-012 drift: AGENTS.md dev command count != live (${TESTS} tests, ${SUITES} suites)"; exit 1; }
          echo "AGENTS.md test counts match live suite"

      - name: Assert config unchanged after tests
        run: git diff --exit-code duckbrain.config.json

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: duckbrain:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
