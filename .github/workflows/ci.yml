name: CI

on:
  push:
    branches: [main, develop, feat/native-s3]
  pull_request:
    branches: [main, develop, feat/native-s3]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No version input: pnpm/action-setup reads the exact packageManager pin.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install from a clean store and smoke-test the CLI
        run: |
          test "$(pnpm --version)" = "12.4.2"
          test ! -e node_modules
          FRESH_STORE="${RUNNER_TEMP}/duckbrain-pnpm-store"
          test ! -e "${FRESH_STORE}"
          pnpm install --frozen-lockfile --store-dir "${FRESH_STORE}"
          for dependency in express duckdb simple-git tsx zod; do
            test -L "node_modules/${dependency}" || {
              echo "Root dependency was not linked: ${dependency}"
              exit 1
            }
          done
          test -L packages/ui/node_modules/react || {
            echo "Workspace dependency was not linked: packages/ui/node_modules/react"
            exit 1
          }
          node bin/duckbrain.js help | tee /tmp/duckbrain-help.out
          grep -q "DuckBrain v1.1.0 - AI Memory System" /tmp/duckbrain-help.out

      # SUP-CI-20261020-DB: fail fast (offline, seconds) when package.json
      # and package-lock.json drift. npm ci (Dockerfile:8 and the docker
      # job) dies with EUSAGE on exactly this drift; this gate names each
      # offending package BEFORE the suite burns minutes. Pure
      # json-vs-json comparison in node — no registry, no network.
      - name: Check lockfile sync
        run: bash scripts/ci/check-lockfile-sync.sh
        env:
          CI: true

      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-1.4.4
          restore-keys: |
            duckdb-extensions-

      - name: Pre-install DuckDB fts extension
        run: node -e "const {Database}=require('duckdb'); const db=new Database(':memory:'); db.exec('INSTALL fts'); db.exec('LOAD fts'); db.close();"

      - name: Run lint
        run: pnpm run --if-present lint

      - name: Run type check
        run: pnpm tsc --noEmit

      # DF-2026-12: bin/duckbrain.js prefers dist/ when present. Build the
      # shipped entry point before the subprocess E2E so CI cannot verify only
      # the TypeScript source while an old ignored dist/ shadows it.
      - name: Build CLI for bin E2E
        run: pnpm build:cli

      - name: Run bin CLI E2E
        run: |
          # TESTQ-2026-10-29-1: fail fast (offline, seconds) when this step's
          # --config cannot discover the bin E2E file. The red baseline
          # (run 40857806554) passed setup, lint, tsc and the CLI build, then
          # died at Vitest with "No test files found" because the config named
          # here had an include list that could not match the file passed to
          # it. The guard asserts Vitest's own discovery, not a glob guess.
          node scripts/ci/check-cli-e2e-config.js
          pnpm exec vitest run --config vitest.cli-e2e.config.ts

      - name: Run tests
        run: pnpm test:run 2>&1 | tee /tmp/vitest.out; exit ${PIPESTATUS[0]}

      # DF-2026-13: the count gate reads the generated, non-protected
      # test-counts.json manifest — AGENTS.md is a protected agent-instruction
      # file that unattended sessions cannot write.
      - name: Assert test-counts.json matches live suite
        run: bash scripts/sync-agents-md-counts.sh --check /tmp/vitest.out

      - name: Assert config unchanged after tests
        run: |
          # The instance config (duckbrain.config.json) is untracked by design
          # (see duckbrain.config.example.json) — the tracked artifact tests
          # must never mutate is the example file.
          git diff --exit-code duckbrain.config.example.json

      - name: Run integration tests
        run: pnpm test:integration
        env:
          CI: true

      # Red-proof gate (TESTQ-001): proves the test suite is NOT a phantom.
      # scripts/red-proof-gate.sh applies known mutations to production code
      # (durability error contract), requires the pinned test file to FAIL
      # over each mutant, then restores. A suite that passes over broken
      # production code is a phantom suite and blocks CI here.
      # (Stryker is dormant — incompatible with TS 7; see the gate script.)
      - name: Red-proof gate (mutation verification)
        run: bash scripts/red-proof-gate.sh
        env:
          CI: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: duckbrain:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
